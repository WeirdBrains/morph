# Build, lint and test on pushes and pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  flutter:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
        working-directory: .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: morph_webview tests
        run: flutter test
        working-directory: packages/morph_webview
      - name: morph_webview_inapp tests
        run: flutter test
        working-directory: packages/morph_webview_inapp
      - name: morph_webview_linux tests
        run: flutter test
        working-directory: packages/morph_webview_linux

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TARGET_DIR: /tmp/morph-cargo-target
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
            . -> /tmp/morph-cargo-target
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev libegl-dev xvfb
        working-directory: .
      - name: Persistent webview session check
        working-directory: packages/morph_webview_linux/linux
        run: |
          c++ -o /tmp/morph-session-check session_check.cc session.cc media_check.cc $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0 libsoup-3.0 gmodule-2.0)
          xvfb-run -a env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 /tmp/morph-session-check
          c++ -o /tmp/morph-frame-check frame_check.cc frame.cc session.cc $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0 libsoup-3.0)
          xvfb-run -a env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 /tmp/morph-frame-check
      - run: flutter pub get
      - run: flutter build linux

  android:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Android unit tests (QR decoder)
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: morph-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
