# Build, lint and test on pushes and pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # What the GPUI desktop shell builds and runs against on Ubuntu 24.04.
  DESKTOP_DEPS: >-
    clang cmake pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev
    libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libwayland-dev libvulkan-dev
    libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libdbus-1-dev

jobs:
  # The whole workspace on Linux, including the GPUI desktop shell
  # (morph-desktop), which needs GPUI's and webkit2gtk's system libraries.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Desktop shell build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $DESKTOP_DEPS
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The Rust crates on macOS and Windows: each has its own keystore backend
  # (Keychain, Credential Manager) and SQLCipher builds its own OpenSSL there.
  # Unit tests use the in-memory keystore; tests/system_keystore.rs (ignored)
  # covers the real one.
  rust-desktop:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p morph-core -p morph-store -p morph-keystore

  # The mobile app's Dart side: analyze and widget tests (the bridge builds
  # for the host so flutter test can load it).
  flutter:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
        working-directory: .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: morph_webview tests
        run: flutter test
        working-directory: packages/morph_webview
      - name: morph_webview_inapp tests
        run: flutter test
        working-directory: packages/morph_webview_inapp

  android:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      # Caches the bridge build and target/ (the aarch64 Android clippy run),
      # under a key of its own so it never mixes with the host jobs' caches.
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
          workspaces: |
            crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
            . -> target
      - run: flutter pub get
      # Sign with the fixed test key when the ANDROID_TEST_* secrets exist
      # (so each APK updates the last one); otherwise the debug key.
      - name: Test signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_TEST_* secrets: the debug key signs"
            exit 0
          fi
          ks="$RUNNER_TEMP/morph-test.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          {
            echo "MORPH_ANDROID_KEYSTORE=$ks"
            echo "MORPH_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MORPH_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "MORPH_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "The fixed test key signs"
      - run: flutter build apk --debug
      - name: APK signer
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk)"
          printf '%s\n' "$certs" | grep -E "certificate (DN|SHA-256 digest)"
          # The fixed test key's certificate (public), when it signed.
          if [ -n "${MORPH_ANDROID_KEYSTORE:-}" ]; then
            printf '%s\n' "$certs" | grep -q "c2af967c4775c926f6db7f051be293821f7b8c4c5b3596c3745ae72fbc8bba51"
          fi
      # c_char is u8 on aarch64 Android, so casts that are fine on x86_64
      # Linux can fail clippy there.
      - name: Clippy for aarch64 Android
        working-directory: .
        run: |
          rustup target add aarch64-linux-android
          rustup component add clippy
          N="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$N/aarch64-linux-android24-clang" \
          CC_aarch64_linux_android="$N/aarch64-linux-android24-clang" \
          AR_aarch64_linux_android="$N/llvm-ar" \
          RANLIB_aarch64_linux_android="$N/llvm-ranlib" \
            cargo clippy --locked -p morph-bridge --target aarch64-linux-android -- -D warnings
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: morph-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # The GPUI desktop shell: release tarball (scripts/linux-dist.sh) and the
  # key, tab, address-bar and popup checks (scripts/xvfb-check.py), on X11
  # (Xvfb) and on native Wayland (headless sway). The media check needs the
  # VP8 (gstreamer1.0-plugins-good) and H.264 (gstreamer1.0-libav) decoders.
  desktop-linux:
    runs-on: ubuntu-24.04
    # llama.cpp for the release x86-64-v3 baseline (scripts/linux-dist.sh sets
    # the same), so every build in the job shares one llama.cpp build.
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      GGML_BMI2: "ON"
      GGML_AVX512: "OFF"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release
      - name: Build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $DESKTOP_DEPS xvfb xdotool openbox mesa-vulkan-drivers rpm sway \
            gstreamer1.0-plugins-good gstreamer1.0-libav imagemagick grim
          # Decodes the QR codes on screen (device linking checks).
          python3 -m pip install --user --break-system-packages zxing-cpp pillow
      - name: Release tarball
        run: scripts/linux-dist.sh
      - name: zip, deb and rpm (with and without the desktop entry)
        run: |
          scripts/linux-packages.sh
          for f in dist/*.deb; do dpkg-deb -I "$f" >/dev/null; done
          sudo apt-get install -y ./dist/morph_*_amd64.deb
          morph --version
          rpm -qp --requires dist/morph-standalone-*.rpm >/dev/null
          sudo apt-get remove -y morph
      # A relay on the runner itself, so the relay check and the link
      # screens have a relay to reserve a slot on (and a round trip to show).
      - name: Local relay and test app
        run: cargo build --release --locked -p weirdnet-device-link --example local-relay && cargo build --release --locked -p morph-services --example serve-app
      - name: Xvfb checks
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MORPH_REQUIRE_QR: "1"
        run: python3 scripts/xvfb-check.py --bin target/release/morph --local-relay target/release/examples/local-relay --app-server target/release/examples/serve-app --report dist/xvfb-checks.md
      - name: Wayland checks (headless sway, the same keys)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MORPH_REQUIRE_QR: "1"
        run: |
          cargo build --release --locked -p morph-wl-input
          python3 scripts/xvfb-check.py --wayland --bin target/release/morph --local-relay target/release/examples/local-relay --app-server target/release/examples/serve-app --report dist/wayland-checks.md
      - name: Wayland checks at scale 2 (HiDPI)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 scripts/xvfb-check.py --wayland --scale 2 --bin target/release/morph --report dist/wayland-hidpi-checks.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-linux-x86_64
          path: |
            dist/morph-*-x86_64-unknown-linux-gnu.tar.gz
            dist/morph-*-x86_64-unknown-linux-gnu.zip
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
            dist/xvfb-checks.md
            dist/wayland-checks.md
            dist/wayland-hidpi-checks.md
          if-no-files-found: warn

  # The GPUI desktop shell on macOS (WKWebView child views): clippy and the
  # shell's tests, a universal Morph.app (arm64 + x86_64) in a zip and a dmg
  # (scripts/macos-dist.sh), and the smoke test: a window, a page from a
  # local server, the page bridge (scripts/desktop-smoke.py).
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-macos
      - name: llama.cpp build tools (cmake, clang)
        run: |
          command -v cmake >/dev/null || brew install cmake
          cmake --version | head -1
          clang --version | head -1
      - run: cargo clippy --locked -p morph-desktop -p morph-webview -p morph-browser --all-targets -- -D warnings
      - run: cargo test --locked -p morph-desktop -p morph-webview -p morph-browser
      - name: Morph.app (zip, dmg)
        run: scripts/macos-dist.sh
      - name: Smoke test
        env:
          MORPH_REQUIRE_QR: "1"
        run: |
          python3 -m pip install --user --break-system-packages zxing-cpp pillow
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "morph-desktop"))')"
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          ditto -x -k dist/morph-*-universal-apple-darwin.zip /tmp/smoke
          hdiutil verify dist/morph-*-universal-apple-darwin.dmg
          # Registered as a browser and for weirdnet-morph:// (macOS lists it under Default web browser).
          plist=/tmp/smoke/Morph.app/Contents/Info.plist
          plutil -lint "$plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = com.weirdbrains.morph
          plutil -convert json -o - "$plist" | python3 -c 'import json,sys; p=json.load(sys.stdin); s={x for t in p["CFBundleURLTypes"] for x in t["CFBundleURLSchemes"]}; d={x for t in p["CFBundleDocumentTypes"] for x in t["LSItemContentTypes"]}; assert {"http","https","weirdnet-morph"} <= s, s; assert {"public.html","public.xhtml"} <= d, d; print("Info.plist ok:", sorted(s), sorted(d))'
          # A mount point of our own: the last line of attach's output does
          # not always name the volume.
          mnt=/tmp/morph-dmg
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/morph-*-universal-apple-darwin.dmg
          grep -q weirdnet-morph "$mnt/Morph.app/Contents/Info.plist"
          hdiutil detach "$mnt"
          python3 scripts/desktop-smoke.py /tmp/smoke/Morph.app/Contents/MacOS/morph --version "$version" --screenshot dist/smoke-macos.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-macos-universal
          path: |
            dist/morph-*-universal-apple-darwin.zip
            dist/morph-*-universal-apple-darwin.dmg
            dist/SHA256SUMS-macos
            dist/smoke-macos*.png
          if-no-files-found: warn

  # The GPUI desktop shell on Windows (WebView2 child views): clippy and the
  # shell's tests, morph.exe in a zip and an MSI (scripts/windows-dist.ps1,
  # WiX v5), the MSI installed and started, and the smoke test. The short
  # target dir keeps OpenSSL's object paths under MAX_PATH.
  desktop-windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:\t\morph
      # The release x86-64-v3 baseline for llama.cpp (scripts/windows-dist.ps1
      # sets the same), so clippy, tests and the release build share it.
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      GGML_BMI2: "ON"
      GGML_AVX512: "OFF"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows
      - name: llama.cpp build tools (cmake, MSVC)
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y }
          cmake --version
      - run: cargo clippy --locked -p morph-desktop -p morph-webview -p morph-browser --all-targets -- -D warnings
      - run: cargo test --locked -p morph-desktop -p morph-webview -p morph-browser
      - name: WiX v5
        run: dotnet tool install --global wix --version 5.0.2
      - name: morph.exe (zip, msi)
        run: powershell -ExecutionPolicy Bypass -File scripts/windows-dist.ps1
      - name: Smoke test
        shell: bash
        env:
          MORPH_REQUIRE_QR: "1"
        run: |
          python -m pip install zxing-cpp pillow
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "morph-desktop"))')"
          rm -rf /c/smoke && mkdir -p /c/smoke
          python -c "import glob,zipfile,sys; z=zipfile.ZipFile(glob.glob('dist/morph-*-x86_64-pc-windows-msvc.zip')[0]); bad=[n for n in z.namelist() if chr(92) in n]; sys.exit(f'backslashes in zip: {bad}') if bad else z.extractall('C:/smoke')"
          python scripts/desktop-smoke.py /c/smoke/morph-*/morph.exe --version "$version" --screenshot dist/smoke-windows.png
      - name: MSI installs, starts and uninstalls
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\morph-*-x86_64-pc-windows-msvc.msi).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v msi-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 50; throw "install failed: $($p.ExitCode)" }
          $exe = "$env:ProgramFiles\Morph\morph.exe"
          $out = & $exe --version | Out-String
          Write-Host $out
          if ($out -notmatch "^morph ") { throw "morph --version printed: $out" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Morph.lnk")) { throw "no Start menu shortcut" }
          # Registered as a browser (Default apps lists Morph) and for weirdnet-morph://.
          $caps = 'HKLM:\Software\Clients\StartMenuInternet\Morph\Capabilities'
          $urls = Get-ItemProperty "$caps\URLAssociations"
          if ($urls.http -ne 'MorphHTML' -or $urls.https -ne 'MorphHTML') { throw "URLAssociations: $($urls | Out-String)" }
          if ((Get-ItemProperty "$caps\FileAssociations").'.html' -ne 'MorphHTML') { throw "no .html association" }
          if ((Get-ItemProperty 'HKLM:\Software\RegisteredApplications').Morph -ne 'Software\Clients\StartMenuInternet\Morph\Capabilities') { throw "not in RegisteredApplications" }
          $proto = Get-ItemProperty 'HKLM:\Software\Classes\weirdnet-morph'
          if ($null -eq $proto.'URL Protocol') { throw "weirdnet-morph is not a URL protocol" }
          $cmd = (Get-ItemProperty 'HKLM:\Software\Classes\weirdnet-morph\shell\open\command').'(default)'
          if ($cmd -notlike '*morph.exe*%1*') { throw "weirdnet-morph command: $cmd" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $exe) { throw "morph.exe left behind" }
          if (Test-Path 'HKLM:\Software\Classes\weirdnet-morph') { throw "weirdnet-morph registration left behind" }
          if (Test-Path 'HKLM:\Software\Clients\StartMenuInternet\Morph') { throw "browser registration left behind" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-windows-x86_64
          path: |
            dist/morph-*-x86_64-pc-windows-msvc.zip
            dist/morph-*-x86_64-pc-windows-msvc.msi
            dist/SHA256SUMS-windows
            dist/smoke-windows*.png
          if-no-files-found: warn

  # The Nix flake: both packages (from the release in packaging/nix/release.json)
  # build, patch and start.
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: |
          nix flake check
          nix build .#morph .#morph-standalone
          ./result/bin/morph --version
          test -f result/share/applications/morph.desktop
          test ! -e result-1/share/applications

  # Arch packages: .SRCINFO in sync for both recipes, the source package
  # built with makepkg as a normal user, installed with pacman, and started.
  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo xorg-server-xvfb xdotool
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v5
      - name: .SRCINFO matches PKGBUILD
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          for pkg in morph morph-bin; do
            sudo -u builder bash -c "cd packaging/arch/$pkg && makepkg --printsrcinfo | diff -u .SRCINFO -"
          done
      - name: makepkg (from the checkout)
        run: sudo -u builder bash -c 'cd packaging/arch/morph && makepkg -s --noconfirm'
      - name: pacman -U and start
        run: |
          pacman -U --noconfirm packaging/arch/morph/morph-*.pkg.tar.zst
          morph --version
          Xvfb :9 -screen 0 1280x800x24 &
          sleep 2
          sudo -u builder env DISPLAY=:9 MORPH_HOME=/tmp/morph-ci timeout 20 morph about:blank & pid=$!
          sleep 12
          DISPLAY=:9 xdotool search --name Morph
          kill $pid || true
      - uses: actions/upload-artifact@v4
        with:
          name: morph-arch-package
          path: packaging/arch/morph/morph-*.pkg.tar.zst
          if-no-files-found: error
