# Build, lint and test on pushes and pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # What the GPUI desktop shell builds and runs against on Ubuntu 24.04.
  DESKTOP_DEPS: >-
    clang cmake pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev
    libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libwayland-dev libvulkan-dev
    libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libdbus-1-dev

jobs:
  # The whole workspace on Linux, including the GPUI desktop shell
  # (morph-desktop), which needs GPUI's and webkit2gtk's system libraries.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Desktop shell build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $DESKTOP_DEPS
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The Rust crates on macOS and Windows: each has its own keystore backend
  # (Keychain, Credential Manager) and SQLCipher builds its own OpenSSL there.
  # Unit tests use the in-memory keystore; tests/system_keystore.rs (ignored)
  # covers the real one.
  rust-desktop:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p morph-core -p morph-store -p morph-keystore

  flutter:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
        working-directory: .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: morph_webview tests
        run: flutter test
        working-directory: packages/morph_webview
      - name: morph_webview_inapp tests
        run: flutter test
        working-directory: packages/morph_webview_inapp
      - name: morph_webview_linux tests
        run: flutter test
        working-directory: packages/morph_webview_linux

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TARGET_DIR: /tmp/morph-cargo-target
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
            . -> /tmp/morph-cargo-target
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev libegl-dev xvfb
        working-directory: .
      - name: Persistent webview session check
        working-directory: packages/morph_webview_linux/linux
        run: |
          c++ -o /tmp/morph-session-check session_check.cc session.cc media_check.cc $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0 libsoup-3.0 gmodule-2.0)
          xvfb-run -a env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 /tmp/morph-session-check
          c++ -o /tmp/morph-frame-check frame_check.cc frame.cc session.cc $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0 libsoup-3.0)
          xvfb-run -a env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 /tmp/morph-frame-check
      - run: flutter pub get
      - run: flutter build linux

  android:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      # Caches the bridge build and target/ (the aarch64 Android clippy run),
      # under a key of its own so it never mixes with the host jobs' caches.
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
          workspaces: |
            crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
            . -> target
      - run: flutter pub get
      - run: flutter build apk --debug
      # c_char is u8 on aarch64 Android, so casts that are fine on x86_64
      # Linux can fail clippy there.
      - name: Clippy for aarch64 Android
        working-directory: .
        run: |
          rustup target add aarch64-linux-android
          rustup component add clippy
          N="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$N/aarch64-linux-android24-clang" \
          CC_aarch64_linux_android="$N/aarch64-linux-android24-clang" \
          AR_aarch64_linux_android="$N/llvm-ar" \
          RANLIB_aarch64_linux_android="$N/llvm-ranlib" \
            cargo clippy --locked -p morph-bridge --target aarch64-linux-android -- -D warnings
      - name: Android unit tests (QR decoder)
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: morph-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # The Flutter Windows app. Rust tests already run on windows-latest; this
  # job produces morph.exe. OpenSSL's nmake build needs the short TEMP that
  # scripts/build-windows.ps1 sets, plus nuget.exe for WebView2.
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Build the Windows release zip
        shell: pwsh
        run: |
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            throw "nuget.exe is not on PATH. flutter_inappwebview_windows needs it for the WebView2 SDK."
          }
          if (-not (Get-Command perl -ErrorAction SilentlyContinue)) {
            throw "perl is not on PATH. SQLCipher's vendored OpenSSL needs Strawberry Perl."
          }
          .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: morph-windows-x64
          path: dist/morph-*-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  # The GPUI desktop shell: release tarball (scripts/linux-dist.sh) and the
  # Xvfb key, tab, address-bar and popup checks (scripts/xvfb-check.py).
  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release
      - name: Build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $DESKTOP_DEPS xvfb xdotool openbox mesa-vulkan-drivers
      - name: Release tarball
        run: scripts/linux-dist.sh
      - name: Xvfb checks
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 scripts/xvfb-check.py --bin target/release/morph --report dist/xvfb-checks.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-linux-x86_64
          path: |
            dist/morph-*-x86_64-unknown-linux-gnu.tar.gz
            dist/SHA256SUMS
            dist/xvfb-checks.md
          if-no-files-found: warn

  # Arch packages: .SRCINFO in sync for both recipes, the source package
  # built with makepkg as a normal user, installed with pacman, and started.
  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo xorg-server-xvfb xdotool
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v5
      - name: .SRCINFO matches PKGBUILD
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          for pkg in morph morph-bin; do
            sudo -u builder bash -c "cd packaging/arch/$pkg && makepkg --printsrcinfo | diff -u .SRCINFO -"
          done
      - name: makepkg (from the checkout)
        run: sudo -u builder bash -c 'cd packaging/arch/morph && makepkg -s --noconfirm'
      - name: pacman -U and start
        run: |
          pacman -U --noconfirm packaging/arch/morph/morph-*.pkg.tar.zst
          morph --version
          Xvfb :9 -screen 0 1280x800x24 &
          sleep 2
          sudo -u builder env DISPLAY=:9 MORPH_HOME=/tmp/morph-ci timeout 20 morph about:blank & pid=$!
          sleep 12
          DISPLAY=:9 xdotool search --name Morph
          kill $pid || true
      - uses: actions/upload-artifact@v4
        with:
          name: morph-arch-package
          path: packaging/arch/morph/morph-*.pkg.tar.zst
          if-no-files-found: error
