# Build, lint and test on pushes and pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  flutter:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: morph_webview tests
        run: flutter test
        working-directory: packages/morph_webview

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/morph-cargo-target
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
            . -> ${{ runner.temp }}/morph-cargo-target
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev libegl-dev
        working-directory: .
      - run: flutter pub get
      - run: flutter build linux

  android:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/morph-bridge -> ../../app/.dart_tool/hooks_runner
      - run: flutter pub get
      - run: flutter build apk --debug
