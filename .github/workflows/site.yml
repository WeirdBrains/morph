# Build the Jaspr project site, and deploy it to GitHub Pages from main.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Activate jaspr CLI
        run: dart pub global activate jaspr_cli 0.24.0-beta.1
      - run: dart pub get
      - run: dart analyze
      - name: Build the static site
        run: jaspr build --sitemap-domain https://morph.weirdbrains.com
      - name: Confirm CNAME and pages
        run: |
          for page in index.html features/index.html roadmap/index.html download/index.html; do
            test -f "build/jaspr/$page"
          done
          grep -q 'rel="canonical"' build/jaspr/features/index.html
          grep -q 'Download Morph' build/jaspr/download/index.html
          grep -q 'v0.5' build/jaspr/roadmap/index.html
          # Every image a page uses is in the build.
          for img in $(grep -oh 'src="images/[^"]*"' build/jaspr/*.html build/jaspr/*/index.html | sort -u | sed 's/src="//; s/"$//'); do
            test -f "build/jaspr/$img" || { echo "missing $img"; exit 1; }
          done
          if ! grep -qx 'morph.weirdbrains.com' build/jaspr/CNAME; then
            printf 'morph.weirdbrains.com\n' > build/jaspr/CNAME
          fi
          grep -qx 'morph.weirdbrains.com' build/jaspr/CNAME
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build/jaspr

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
