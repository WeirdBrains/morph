# Morph release config for weirdnet-project-helpers (scripts/weirdnet_release.py).
# Phase builds are pre-releases (v0.2.0-alpha.N, docs/handoff.md):
#   python3 scripts/weirdnet_release.py --pre alpha "Title" ...   # 0.2.0-alpha.7 -> 0.2.0-alpha.8
# then the `next` steps below. The Arch pkgver is {pkgver} (0.2.0alpha8).
helpers = "0.3.0"
project = "morph"
branch = "release/0.2.x"            # 0.2.x patches are cut from this branch (main carries v0.3 work)
require_message = true
tag_message = "{tag}: {title}"
next = [
  "scripts/linux-dist.sh && scripts/linux-packages.sh   # tarball, zip, deb, rpm into dist/",
  "gh run download (CI on the release commit) -n morph-macos-universal -n morph-windows-x86_64 -D dist/",
  "python3 scripts/weirdnet_release.py github {version}   # pre-release with GitHub-named SHA256SUMS",
  "python3 scripts/weirdnet_release.py assets {version}",
  "packaging/arch/*/PKGBUILD: pkgver={pkgver}, _ver={version}, the tarball's sha256; packaging/nix/release.json; .SRCINFO",
  "python3 scripts/weirdnet_release.py taur {version} --dry-run, then without --dry-run",
  "Website: bump latestVersion/latestDate in site/lib/site.dart and sizes in site/lib/pages/download.dart; move shipped items in site/lib/content/features.dart and site/lib/pages/roadmap.dart; push, check the Site workflow and https://morph.weirdbrains.com/download (site/README.md)",
  "Ping Morph intern (Morph site) and Weirdnet Lead Developer (net.weirdbrains.com) with the release link",
]

[env]
CARGO_TARGET_DIR = "<scratch-dir>/cargo-target/morph"

[[files]]                       # only the desktop shell carries the release version
kind = "cargo-package"
paths = ["crates/morph-desktop/Cargo.toml"]
primary = true

[[files]]                       # the phone apps: versionName / CFBundleShortVersionString follow the release,
kind = "pubspec"                # and the +N build (versionCode / CFBundleVersion) grows by one each release;
paths = ["app/pubspec.yaml"]    # the cut fails if it would not exceed the last tag's
build = "increment"

[[files]]
kind = "cargo-lock"
paths = ["Cargo.lock"]
packages = ["morph-desktop"]

[github]                        # `weirdnet_release.py github VERSION`
files = ["dist/morph-{version}-x86_64-unknown-linux-gnu.tar.gz", "dist/morph-{version}-x86_64-unknown-linux-gnu.zip",
         "dist/morph_{debver}-*_amd64.deb", "dist/morph-standalone_{debver}-*_amd64.deb",
         "dist/morph-{debver}-*.x86_64.rpm", "dist/morph-standalone-{debver}-*.x86_64.rpm",
         "dist/morph-{version}-universal-apple-darwin.zip", "dist/morph-{version}-universal-apple-darwin.dmg",
         "dist/morph-{version}-x86_64-pc-windows-msvc.zip", "dist/morph-{version}-x86_64-pc-windows-msvc.msi",
         "dist/morph-{version}-android-debug.apk"]   # the CI debug APK (sideload; debug key, not release-signed)
sums = "SHA256SUMS"

[changelog]
path = "CHANGELOG.md"
first_message_is_title = true

[checks]
commands = [
  "cargo fmt --all --check",
  "cargo clippy --locked --workspace --all-targets -- -D warnings",
  "cargo test -q --locked --workspace",
]

[crates]
publish = []                    # crates are not published in this pass (README)

[taur]
org = "WeirdBrains"

[[taur.packages]]
name = "morph-bin"
dir = "packaging/arch/morph-bin"
source_contains = "v{version}"

[[platforms]]
os = "linux"
arch = ["x86_64"]
arch_note = "aarch64 waits for an ARM64 runner with the GPUI/WebKitGTK stack"
formats = ["tar.gz", "zip", "deb", "rpm", "pkg.tar.zst", "nix"]
channels = ["github", "taur", "nix"]
assets = ["morph-{version}-x86_64-unknown-linux-gnu.tar.gz", "morph-{version}-x86_64-unknown-linux-gnu.zip",
          "morph_*_amd64.deb", "morph-standalone_*_amd64.deb", "morph-*.x86_64.rpm", "morph-standalone-*.x86_64.rpm",
          "SHA256SUMS"]

[[platforms]]
os = "macos"
arch = ["universal"]
formats = ["zip", "dmg", "app"]
channels = ["github"]
assets = ["morph-{version}-universal-apple-darwin.zip", "morph-{version}-universal-apple-darwin.dmg"]

[[platforms]]
os = "windows"
arch = ["x86_64"]
arch_note = "aarch64 not built yet (no Windows on ARM runner in CI)"
formats = ["zip", "msi"]
channels = ["github"]
assets = ["morph-{version}-x86_64-pc-windows-msvc.zip", "morph-{version}-x86_64-pc-windows-msvc.msi"]

[[platforms]]
os = "android"
arch = ["aarch64", "x86_64"]
formats = ["apk", "aab"]
channels = ["github", "apk-sideload", "fdroid", "google-play"]
assets = ["morph-{version}-android-debug.apk"]

[[platforms]]
os = "ios"
arch = ["aarch64"]
formats = ["ipa"]
channels = ["testflight", "app-store", "altstore", "eu-marketplace"]
assets = []
