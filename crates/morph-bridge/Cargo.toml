[package]
name = "morph-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flutter_rust_bridge API over morph-core for the Morph Flutter app."
publish = false

[lib]
name = "morph_bridge"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge.workspace = true
morph-core.workspace = true
morph-identity.workspace = true
morph-webview-control.workspace = true

# hickory-resolver (libp2p DNS inside weirdnet-net) reads the system DNS
# servers through ndk-context on Android; see src/android.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys.workspace = true
ndk-context.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
