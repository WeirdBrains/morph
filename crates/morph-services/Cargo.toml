[package]
name = "morph-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Morph logic both shells share, without a UI toolkit: profiles, the encrypted library's open and unlock, profile identities and device linking."
publish = false

[dependencies]
morph-core.workspace = true
morph-identity.workspace = true
morph-keystore.workspace = true
morph-store.workspace = true
weirdnet-keys.workspace = true
thiserror.workspace = true
serde_json.workspace = true
# Weirdnet app calls (`weirdnet-<app>://` addresses): resolve, call, stream.
weirdnet-net.workspace = true
weirdnet-sync.workspace = true
futures = "0.3"
# The router's first-message timeout, on whatever executor drives the sessions.
futures-timer = "3"
# Companion records (companion_sync) and routing to linked devices (node_router).
morph-ai.workspace = true
# `serve`: `decode_cert`, for the certificate a caller presents (the inference host's authorize).
weirdnet-agent = { workspace = true, features = ["serve"] }
serde.workspace = true
# Keyed digests of MCP secret values in the companion-sync snapshot (never the values).
blake3.workspace = true
async-trait.workspace = true
# The inference service's sessions run on a small runtime of their own (infer_serving).
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# A relay's display name from its well-known info (HTTPS, in the background).
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Tests never touch the real OS keystore.
morph-keystore = { workspace = true, features = ["mock"] }
tempfile.workspace = true
weirdnet-device-link.workspace = true
# Tests check no plain SHA-256 of a secret is kept.
sha2.workspace = true
# Loopback tests of the agent protocols over linked devices.
weirdnet-agent = { workspace = true, features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# The ignored real-Gemma loopback test.
weirdnet-model = { workspace = true, features = ["llama"] }
morph-ai = { workspace = true, features = ["local"] }
