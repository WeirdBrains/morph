[package]
name = "morph-webview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Morph's web view boundary: a WebView trait and events, a wry backend (webkit2gtk child windows on Linux) and an in-memory fake for tests."
publish = false

[dependencies]
thiserror.workspace = true

# The wry backend: Linux only for now (ARCHITECTURE.md section 2.0). macOS
# (WKWebView) and Windows (WebView2) are planned behind the same trait.
[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
raw-window-handle.workspace = true
webkit2gtk.workspace = true
wry.workspace = true
x11-dl.workspace = true
