[package]
name = "morph-webview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Morph's web view boundary: a WebView trait and events, wry backends (webkit2gtk on Linux, WKWebView on macOS, WebView2 on Windows) and an in-memory fake for tests."
publish = false

[dependencies]
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The wry backends (ARCHITECTURE.md section 2.0): webkit2gtk on Linux,
# WKWebView on macOS and WebView2 on Windows, behind the same trait.
[target.'cfg(target_os = "linux")'.dependencies]
gdkx11.workspace = true
gtk.workspace = true
javascriptcore-rs.workspace = true
raw-window-handle.workspace = true
webkit2gtk.workspace = true
wry.workspace = true
x11-dl.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
raw-window-handle.workspace = true
wry.workspace = true

# Morph's script world for reads and actions (docs/bridge-api.md): a
# WKContentWorld on macOS, a CDP isolated world on WebView2. The same
# versions wry 0.57 uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKContentWorld", "WKFrameInfo", "WKWebView"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"

# The bridge in a real WebKitGTK page; needs a display (xvfb-run), skips without one.
[[test]]
name = "bridge_webkit"
harness = false

# Throwaway storage and page actions in real WebKitGTK pages; needs a display (xvfb-run), skips without one.
[[test]]
name = "session_actions_webkit"
harness = false
