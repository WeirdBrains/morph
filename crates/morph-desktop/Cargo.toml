[package]
name = "morph-desktop"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Morph's desktop shell on GPUI: the window and the component host (ARCHITECTURE.md sections 2.0 and 2a)."
publish = false

[[bin]]
name = "morph"
path = "src/main.rs"

[dependencies]
morph-core.workspace = true

gpui.workspace = true
gpui_platform.workspace = true
image.workspace = true
morph-ai = { workspace = true, features = ["local", "mcp"] }
weirdnet-model = { workspace = true, features = ["llama"] }
morph-browser.workspace = true
morph-companion.workspace = true
morph-identity.workspace = true
morph-os.workspace = true
morph-services.workspace = true
morph-ui.workspace = true
morph-webview.workspace = true
qrcode.workspace = true
raw-window-handle.workspace = true
unicode-segmentation.workspace = true
weirdnet-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
# The Companion panel runs its sessions on a worker thread.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
# Logged-out research fetches with no cookie store (companion_web.rs).
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "gzip"] }

# Linux: GPUI's patched platform (the raw key behind a key event) and the
# render check's process handling.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux.workspace = true
libc.workspace = true

# Windows: `morph --version` and errors reach the console the app was
# started from (the release binary is a GUI app, with no console of its own).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
# Tests never touch the real OS keystore.
morph-keystore = { workspace = true, features = ["mock"] }
tempfile.workspace = true
# Reads the identity QR codes back.
rqrr = "0.9"
# A Ymir node's link code, made as `ymirctl pool link` makes it.
weirdnet-device-link.workspace = true
weirdnet-net.workspace = true
