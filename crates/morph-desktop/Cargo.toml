[package]
name = "morph-desktop"
version = "0.2.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Morph's desktop shell on GPUI: the window and the component host (ARCHITECTURE.md sections 2.0 and 2a)."
publish = false

[[bin]]
name = "morph"
path = "src/main.rs"

[dependencies]
morph-core.workspace = true

# Linux first (ARCHITECTURE.md section 2.0). On macOS and Windows the binary
# only says the GPUI shell is not there yet, so workspace builds stay green.
[target.'cfg(target_os = "linux")'.dependencies]
gpui.workspace = true
gpui_platform.workspace = true
morph-browser.workspace = true
morph-identity.workspace = true
morph-services.workspace = true
morph-ui.workspace = true
morph-webview.workspace = true
qrcode.workspace = true
raw-window-handle.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# Tests never touch the real OS keystore.
morph-keystore = { workspace = true, features = ["mock"] }
tempfile.workspace = true
