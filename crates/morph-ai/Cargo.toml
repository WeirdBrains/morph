[package]
name = "morph-ai"
description = "Morph's companion roster, grants and allows store, and the model, browser and research interfaces the Companions run on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = []
# `LocalModels`: the provider over weirdnet-model (downloads, worker per model).
local = ["dep:weirdnet-model", "weirdnet-model/agent"]

[dependencies]
weirdnet-model = { workspace = true, optional = true }
weirdnet-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["rt"] }
