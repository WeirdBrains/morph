[workspace]
resolver = "2"
members = ["crates/morph-core", "crates/morph-identity", "crates/morph-store", "crates/morph-keystore", "crates/morph-bridge", "crates/morph-webview-control", "crates/weirdnet-device-link", "crates/morph-ui", "crates/morph-webview", "crates/morph-browser", "crates/morph-services", "crates/morph-desktop", "crates/morph-wl-input"]
default-members = ["crates/morph-core", "crates/morph-identity", "crates/morph-store", "crates/morph-keystore", "crates/morph-bridge", "crates/morph-webview-control", "crates/weirdnet-device-link", "crates/morph-ui", "crates/morph-webview", "crates/morph-browser", "crates/morph-services", "crates/morph-desktop", "crates/morph-wl-input"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
repository = "https://github.com/WeirdBrains/morph"
homepage = "https://github.com/WeirdBrains/morph"

[workspace.dependencies]
morph-core = { path = "crates/morph-core" }
morph-identity = { path = "crates/morph-identity" }
morph-store = { path = "crates/morph-store" }
morph-keystore = { path = "crates/morph-keystore" }
morph-webview-control = { path = "crates/morph-webview-control" }
weirdnet-device-link = { path = "crates/weirdnet-device-link" }
morph-ui = { path = "crates/morph-ui" }
morph-webview = { path = "crates/morph-webview" }
morph-browser = { path = "crates/morph-browser" }
morph-services = { path = "crates/morph-services" }
weirdnet-keys = "=0.1.0"
weirdnet-net = "=0.1.0"
thiserror = "2"
dirs = "7.0.0"
zeroize = { version = "1", features = ["derive"] }
flutter_rust_bridge = "=2.13.0"
tempfile = "3"
# morph-desktop: the DMA-BUF probe loads the system GBM and EGL at run time.
libc = "0.2"
hkdf = "0.13.0"
sha2 = "0.11.1"
jni-sys = "0.4.1"
ndk-context = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
unicode-segmentation = "1"
# Desktop shell (ARCHITECTURE.md section 2.0). GPUI is pinned to a Zed commit:
# crates.io gpui 0.2.2 cannot hand out an X11 window handle. Bump on purpose.
gpui = { git = "https://github.com/zed-industries/zed", rev = "703b5ac3f4ffe1e87a073123ae56e22f72f095c4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "703b5ac3f4ffe1e87a073123ae56e22f72f095c4", features = ["font-kit", "wayland", "x11"] }
# GPUI's Linux platform, patched (third_party/gpui_linux): the raw key behind a key event.
gpui_linux = { git = "https://github.com/zed-industries/zed", rev = "703b5ac3f4ffe1e87a073123ae56e22f72f095c4", default-features = false, features = ["wayland", "x11"] }
# Pages the shell draws itself (off-screen web views on Wayland) become GPUI images.
image = { version = "0.25", default-features = false }
wry = "=0.57.2"
# morph-wl-input (the Wayland key suite's keyboard and pointer).
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.8", default-features = false }
gtk = "0.18"
gdkx11 = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
javascriptcore-rs = { version = "=1.1.2", features = ["v2_28"] }
raw-window-handle = "0.6"
x11-dl = "2.21"

# Shipped builds favour size: the Android APK must stay under 25 MB.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Patched copies of published crates; why and when they go away:
# third_party/README.md.
[patch.crates-io]
libp2p-swarm = { path = "third_party/libp2p-swarm" }

[patch."https://github.com/zed-industries/zed"]
gpui_linux = { path = "third_party/gpui_linux" }
