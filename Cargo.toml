[workspace]
resolver = "2"
members = ["crates/morph-core", "crates/morph-identity", "crates/morph-store", "crates/morph-keystore", "crates/morph-bridge", "crates/morph-webview-control", "crates/weirdnet-device-link"]
default-members = ["crates/morph-core", "crates/morph-identity", "crates/morph-store", "crates/morph-keystore", "crates/morph-bridge", "crates/morph-webview-control", "crates/weirdnet-device-link"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
repository = "https://github.com/WeirdBrains/morph"
homepage = "https://github.com/WeirdBrains/morph"

[workspace.dependencies]
morph-core = { path = "crates/morph-core" }
morph-identity = { path = "crates/morph-identity" }
morph-store = { path = "crates/morph-store" }
morph-keystore = { path = "crates/morph-keystore" }
morph-webview-control = { path = "crates/morph-webview-control" }
weirdnet-device-link = { path = "crates/weirdnet-device-link" }
weirdnet-keys = "=0.1.0"
weirdnet-net = "=0.1.0"
thiserror = "2"
dirs = "6"
zeroize = { version = "1", features = ["derive"] }
flutter_rust_bridge = "=2.13.0"
tempfile = "3"
hkdf = "0.12"
sha2 = "0.10"
jni-sys = "0.4"
ndk-context = "0.1"

# Shipped builds favour size: the Android APK must stay under 25 MB.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
