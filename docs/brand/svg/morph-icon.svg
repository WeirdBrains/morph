<?xml version="1.0" encoding="UTF-8"?>
<!--
  Morph app icon. Rounded-square charcoal plate (#0D0D12) with the
  glitch mark. Corner radius 224 (22% of 1024), close to the iOS
  squircle proportion, for previews, Linux, Windows, and favicons.
  iOS and macOS catalog assets use the square sibling instead so
  the OS can apply its own mask.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024"
     height="1024"
     fill="none"
     role="img"
     aria-label="Morph">
  <rect width="1024" height="1024" rx="224" fill="#0D0D12"/>
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M192 192h192L512 448 640 192h192v640H640V448H384v384H192Z"/>
  <g id="glitch">
    <rect fill="#00E5FF" x="128" y="320" width="224" height="64"/>
    <rect fill="#FF2BD6" x="288" y="320" width="112" height="64"/>
    <rect fill="#00E5FF" x="656" y="320" width="112" height="64"/>
    <rect fill="#FF2BD6" x="672" y="320" width="224" height="64"/>
    <rect fill="#00E5FF" x="96"  y="400" width="160" height="32"/>
    <rect fill="#FF2BD6" x="320" y="400" width="96"  height="32"/>
    <rect fill="#00E5FF" x="624" y="400" width="80"  height="32"/>
    <rect fill="#FF2BD6" x="768" y="400" width="144" height="32"/>
    <rect fill="#00E5FF" x="64"  y="448" width="288" height="64"/>
    <rect fill="#FF2BD6" x="304" y="448" width="128" height="64"/>
    <rect fill="#00E5FF" x="592" y="448" width="128" height="64"/>
    <rect fill="#FF2BD6" x="672" y="448" width="288" height="64"/>
    <rect fill="#00E5FF" x="160" y="544" width="176" height="32"/>
    <rect fill="#FF2BD6" x="256" y="544" width="80"  height="32"/>
    <rect fill="#00E5FF" x="704" y="544" width="64"  height="32"/>
    <rect fill="#FF2BD6" x="800" y="544" width="112" height="32"/>
    <rect fill="#00E5FF" x="80"  y="608" width="272" height="64"/>
    <rect fill="#FF2BD6" x="336" y="608" width="80"  height="64"/>
    <rect fill="#00E5FF" x="608" y="608" width="80"  height="64"/>
    <rect fill="#FF2BD6" x="672" y="608" width="272" height="64"/>
    <rect fill="#00E5FF" x="128" y="688" width="192" height="32"/>
    <rect fill="#FF2BD6" x="352" y="688" width="64"  height="32"/>
    <rect fill="#00E5FF" x="640" y="688" width="96"  height="32"/>
    <rect fill="#FF2BD6" x="736" y="688" width="160" height="32"/>
  </g>
</svg>
