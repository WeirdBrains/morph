<!doctype html><html><head><title>Popup</title></head><body>
<input id="e" autofocus placeholder="Email" style="font-size:24px"><button id="n" onclick="document.getElementById('h').textContent='Changed heading';">Next</button>
<h1 id="h">Sign in</h1>
<script>document.getElementById('e').addEventListener('input',e=>{document.title='popup:'+e.target.value; if(window.opener) window.opener.postMessage(e.target.value,'*')});</script>
</body></html>
