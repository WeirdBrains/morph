<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Morph pointer and keyboard test</title>
  <style>
    body { font-family: sans-serif; background: #0d0d12; color: #eee; margin: 24px; }
    a { color: #00e5ff; cursor: pointer; }
    .hover-box {
      width: 280px; height: 80px; line-height: 80px; text-align: center;
      background: #222; border: 2px solid #555; margin: 16px 0;
    }
    .hover-box:hover { background: #ff2bd6; color: #0d0d12; border-color: #00e5ff; }
    input, textarea {
      display: block; width: 320px; margin: 8px 0; padding: 8px;
      font-size: 16px; background: #1a1a22; color: #fff; border: 1px solid #555;
    }
  </style>
</head>
<body>
  <h1>Morph input test</h1>
  <div id="hover" class="hover-box">Hover me — I should change color</div>
  <p><a id="link" href="#ok">A cursor:pointer link</a></p>
  <form id="form" action="#">
    <label>Input <input id="field" name="q" type="text" placeholder="type here"></label>
    <label>Textarea <textarea id="area" name="body" rows="4" placeholder="type here too"></textarea></label>
    <button id="submit" type="submit">Submit</button>
  </form>
  <pre id="log"></pre>
  <script>
    window.__morph = {
      submitted: false,
      keys: [],
      field: '',
      area: '',
      active: ''
    };
    const form = document.getElementById('form');
    const field = document.getElementById('field');
    const area = document.getElementById('area');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      window.__morph.submitted = true;
    });
    document.addEventListener('keydown', function (e) {
      window.__morph.keys.push({
        key: e.key,
        code: e.code,
        repeat: e.repeat,
        shift: e.shiftKey,
        ctrl: e.ctrlKey,
        alt: e.altKey,
        meta: e.metaKey,
        target: e.target && e.target.id
      });
      window.__morph.field = field.value;
      window.__morph.area = area.value;
      window.__morph.active = document.activeElement ? document.activeElement.id : '';
    });
    window.__morphSnapshot = function () {
      window.__morph.field = field.value;
      window.__morph.area = area.value;
      window.__morph.active = document.activeElement ? document.activeElement.id : '';
      return JSON.stringify(window.__morph);
    };
  </script>
</body>
</html>
