name: morph_webview_inapp
description: Morph macOS (WKWebView), Windows (WebView2), and Android WebView backends via flutter_inappwebview.
version: 0.1.0
publish_to: none
homepage: https://github.com/WeirdBrains/morph
repository: https://github.com/WeirdBrains/morph
license: BSD-3-Clause

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  morph_webview:
    path: ../morph_webview
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/morph-bridge.js
    - assets/morph-rust-shim.js
  plugin:
    implements: morph_webview
    platforms:
      macos:
        dartPluginClass: MorphWebViewInApp
        pluginClass: MorphWebViewInAppPlugin
      windows:
        dartPluginClass: MorphWebViewInApp
      android:
        dartPluginClass: MorphWebViewInApp
