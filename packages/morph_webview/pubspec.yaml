name: morph_webview
description: Morph's cross-platform web view interface, page bridge, and navigation API.
version: 0.1.0
publish_to: none
homepage: https://github.com/WeirdBrains/morph
repository: https://github.com/WeirdBrains/morph
license: BSD-3-Clause

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  morph_webview_linux:
    path: ../morph_webview_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        default_package: morph_webview_linux
