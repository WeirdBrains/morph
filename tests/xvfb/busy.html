<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- A page like Gmail at rest: background requests every 100 ms, a timer
     every 100 ms and an animation that never stops. Its title (JSON, M{...})
     reports how late the timer fires (t: 90th percentile of the gap, ms),
     how long a request takes (f: 90th percentile, ms), how many of each
     finished (nt, nf) and whether the page thinks it is visible (v). -->
<title>busy</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  #spin { width: 120px; height: 120px; margin: 40px; border-radius: 50%;
          border: 12px solid #ddd; border-top-color: #1a73e8;
          animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="spin"></div>
<script>
  const gaps = [], fetches = [];
  let nt = 0, nf = 0, last = performance.now();
  const p90 = (a) => a.length ? Math.round([...a].sort((x, y) => x - y)[Math.floor(a.length * 0.9)]) : -1;
  const keep = (a, v) => { a.push(v); if (a.length > 30) a.shift(); };
  function report() {
    document.title = "M" + JSON.stringify({ t: p90(gaps), f: p90(fetches), nt, nf, v: document.visibilityState });
  }
  function tick() {
    const now = performance.now();
    keep(gaps, now - last);
    last = now;
    nt++;
    report();
    setTimeout(tick, 100);
  }
  setTimeout(tick, 100);
  setInterval(() => {
    const at = performance.now();
    fetch("/ping?" + nf, { cache: "no-store" }).then((r) => r.text()).then(() => {
      keep(fetches, performance.now() - at);
      nf++;
    }).catch(() => {});
  }, 100);
</script>
</body>
</html>
